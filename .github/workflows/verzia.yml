name: Číslo verzie

# Dve kontroly toho istého pravidla — jeden zlúčený PR = presne +1
# (docs/verziovanie.md):
#
#   `kontrola`   pri PR overí, že `version.json` vo vetve je o jedna vyššie
#                než na `main`;
#   `po-zluceni` po pushi do `main` overí, že sa číslo naozaj posunulo.
#
# Prečo obe: kontrola pri PR beží pri otvorení a pri pushi do vetvy, nie pri
# zlúčení. Dva súbežne otvorené PR-y teda obidva uvidia to isté `main`, obidva
# si nastavia rovnaké číslo a obidvom kontrola prejde — presne to sa stalo pri
# verzii 196, ktorú nesú tri zlúčené PR-y (#231). Kontrola po zlúčení to
# nezastaví, ale hneď pomenuje.
#
# Úplne tomu zabráni až nastavenie repozitára „Require branches to be up to
# date before merging" v ochrane `main` — vtedy musí druhý PR dobehnúť `main`,
# čím sa kontrola pri PR spustí znova a vypýta si ďalšie číslo.
#
# Prečo číslo nezvyšuje workflow po zlúčení: `main` má ruleset „Changes must be
# made through a pull request", takže push z Actions doň neprejde (GH013).
# Číslo preto prináša sama vetva.
#
# Keď `kontrola` zlyhá, stačí vo vetve spustiť `npm run verzia` a commitnúť
# version.json.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kontrola:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Kontrola porovnáva s `main`; plytký klon PR ho nemá.
      - name: Dotiahnuť main
        run: git fetch origin main --depth=1

      - name: Verzia je o jedna vyššia než na main
        run: node scripts/bump-version.mjs --kontrola

  po-zluceni:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Porovnáva sa s predchádzajúcim commitom, takže treba oba.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zlúčenie zvýšilo verziu o jedna
        run: node scripts/bump-version.mjs --kontrola-main
