name: Číslo verzie

# Overí, že `version.json` vo vetve je o jedna vyššie než na `main`.
# Zlúčením PR sa tak `main` posunie o +1 — jeden zlúčený PR = jedna verzia.
#
# Prečo to kontroluje PR a nezvyšuje to workflow po zlúčení: `main` má ruleset
# „Changes must be made through a pull request", takže push z Actions doň
# neprejde (GH013). Číslo preto prináša sama vetva.
#
# Keď kontrola zlyhá, stačí vo vetve spustiť `npm run verzia` a commitnúť
# version.json. Podrobnosti sú v docs/verziovanie.md.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Kontrola porovnáva s `main`; plytký klon PR ho nemá.
      - name: Dotiahnuť main
        run: git fetch origin main --depth=1

      - name: Verzia je o jedna vyššia než na main
        run: node scripts/bump-version.mjs --kontrola
